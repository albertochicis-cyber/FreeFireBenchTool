name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          if [ -f FreeFireBenchTool.zip ]; then
            unzip -o FreeFireBenchTool.zip -d extracted_repo
            if [ -d extracted_repo/FreeFireBenchTool ]; then
              cp -rn extracted_repo/FreeFireBenchTool/* .
            else
              cp -rn extracted_repo/* .
            fi
          fi

      - name: Enable Compose Compiler plugin for Kotlin 2.0+
        run: |
          if [ -f settings.gradle.kts ] && ! grep -q "org.jetbrains.kotlin.plugin.compose" settings.gradle.kts; then
            cat << 'EOF' >> settings.gradle.kts

gradle.beforeProject { project ->
    project.plugins.withId("com.android.application") {
        if (project.extensions.findByName("kotlin") != null) {
            project.plugins.apply("org.jetbrains.kotlin.plugin.compose")
        }
    }
}
EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
