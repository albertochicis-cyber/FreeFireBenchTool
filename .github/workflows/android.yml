name: APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o FreeFireBenchTool.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          if [ -f app/build.gradle.kts ] && ! grep -q "org.jetbrains.kotlin.plugin.compose" app/build.gradle.kts; then
            printf '\napply(plugin = "org.jetbrains.kotlin.plugin.compose")\n' >> app/build.gradle.kts
          fi
          chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
